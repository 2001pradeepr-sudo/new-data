<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Moving Text</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    height:100vh;
    overflow:hidden;
    display:flex;
    justify-content:center;
    align-items:center;

    font-family:Arial,sans-serif;

    background:
        radial-gradient(circle at 15% 20%,#ff70c8,transparent 30%),
        radial-gradient(circle at 85% 25%,#55ddff,transparent 30%),
        radial-gradient(circle at 50% 100%,#7655ff,transparent 35%),
        #080b19;
}

/* Glass Card */
.card{
    position:relative;
    width:90%;
    max-width:650px;
    padding:50px 25px;

    text-align:center;
    color:white;

    background:rgba(255,255,255,.13);
    border:1px solid rgba(255,255,255,.35);
    border-radius:35px;

    backdrop-filter:blur(25px);
    -webkit-backdrop-filter:blur(25px);

    box-shadow:0 25px 70px rgba(0,0,0,.4);

    overflow:hidden;
}

/* Main Text */
.title{
    font-size:55px;
    font-weight:800;
    letter-spacing:2px;

    display:flex;
    justify-content:center;
    flex-wrap:wrap;
}

/* Each letter */
.title span{
    display:inline-block;

    opacity:0;
    transform:
        translateY(80px)
        rotate(15deg)
        scale(.5);

    animation:
        letterIn .7s cubic-bezier(.2,.8,.2,1) forwards,
        letterFloat 2.5s ease-in-out infinite;

}

/* Different delay for every letter */
.title span:nth-child(1){animation-delay:.1s,1.5s;}
.title span:nth-child(2){animation-delay:.2s,1.6s;}
.title span:nth-child(3){animation-delay:.3s,1.7s;}
.title span:nth-child(4){animation-delay:.4s,1.8s;}
.title span:nth-child(5){animation-delay:.5s,1.9s;}
.title span:nth-child(6){animation-delay:.6s,2s;}
.title span:nth-child(7){animation-delay:.7s,2.1s;}

/* Letter entrance */
@keyframes letterIn{

    0%{
        opacity:0;
        transform:
            translateY(80px)
            rotate(15deg)
            scale(.5);
    }

    70%{
        transform:
            translateY(-10px)
            rotate(-5deg)
            scale(1.1);
    }

    100%{
        opacity:1;
        transform:
            translateY(0)
            rotate(0)
            scale(1);
    }
}

/* Floating letters */
@keyframes letterFloat{

    0%,100%{
        transform:translateY(0);
    }

    50%{
        transform:translateY(-12px);
    }
}

/* Subtitle */
.subtitle{
    margin-top:20px;
    font-size:19px;
    opacity:0;

    animation:
        subtitleIn 1s ease 1.5s forwards,
        subtitleFloat 3s ease-in-out 2.5s infinite;
}

@keyframes subtitleIn{

    from{
        opacity:0;
        transform:translateY(25px);
    }

    to{
        opacity:.8;
        transform:translateY(0);
    }
}

@keyframes subtitleFloat{

    0%,100%{
        transform:translateY(0);
    }

    50%{
        transform:translateY(-5px);
    }
}

/* Moving words */
.moving{
    position:absolute;
    white-space:nowrap;

    font-size:18px;
    font-weight:bold;

    opacity:.6;

    animation:moveText 10s linear infinite;
}

.m1{
    top:15px;
    left:-200px;
}

.m2{
    bottom:15px;
    left:-300px;
    animation-delay:3s;
}

@keyframes moveText{

    from{
        left:-300px;
    }

    to{
        left:100%;
    }
}

/* Shine */
.card::after{
    content:"";

    position:absolute;
    top:-100%;
    left:-50%;

    width:40%;
    height:300%;

    background:rgba(255,255,255,.12);

    transform:rotate(25deg);

    animation:shine 5s linear infinite;
}

@keyframes shine{

    0%{
        left:-60%;
    }

    100%{
        left:130%;
    }
}

/* Mobile */
@media(max-width:500px){

    .title{
        font-size:38px;
    }

    .subtitle{
        font-size:16px;
    }
}
</style>
</head>

<body>

<div class="card">

    <!-- Moving words -->
    <div class="moving m1">
        ✨ WELCOME ✨
    </div>

    <div class="moving m2">
       🚀🚀🚀 CREATIVE DESIGN 🚀🚀🚀
    </div>

    <!-- Main Text -->
    <div class="title">
    <span style="color: #07c7f7;">P</span>
        <span style="color: #0ccdfd;">R</span>
        <span style="color: #057e9c;">A</span>
        <span style="color: #026179;">D</span>
        <span style="color: #034252;">E</span>
        <span style="color: #02222b;">E</span>
        <span style="color: #011e25;">P</span>

    </div>

    <div class="subtitle">
        ✨ Magic••Fun ✨
    </div>

</div>

</body>
</html>
